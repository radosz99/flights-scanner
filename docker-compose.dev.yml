version: '3.8'

services:
  # MongoDB Database (inherit from base)
  mongodb:
    env_file:
      - .env

  # Backend API Service - Development Mode with Hot Reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      # Mount code for hot reload in development
      - ./backend:/app
    command: ["uvicorn", "api.api:app", "--host", "0.0.0.0", "--port", "8900", "--reload"]
    healthcheck:
      # Disable healthcheck in dev mode for faster startup
      test: ["CMD-SHELL", "exit 0"]
      interval: 1m
      timeout: 10s
      retries: 1

  # Frontend Service - Development Mode (runs in production mode, no hot reload)
  # Note: Only backend has hot reload in dev mode to avoid complexity with node_modules
  frontend:
    healthcheck:
      # Disable healthcheck in dev mode for faster startup
      test: ["CMD-SHELL", "exit 0"]
      interval: 1m
      timeout: 10s
      retries: 1
