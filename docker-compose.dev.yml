version: '3.8'

services:
  # MongoDB Database (inherit from base)
  mongodb:
    env_file:
      - mongo.env

  # Backend API Service - Development Mode with Hot Reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - mongo.env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      # Mount code for hot reload in development
      - ./backend:/app
    command: ["uvicorn", "api.api:app", "--host", "0.0.0.0", "--port", "8900", "--reload"]
    healthcheck:
      # Disable healthcheck in dev mode for faster startup
      test: ["CMD-SHELL", "exit 0"]
      interval: 1m
      timeout: 10s
      retries: 1

  # Frontend Service - Development Mode
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8901
      NODE_ENV: development
    volumes:
      # Mount code for hot reload in development
      - ./frontend:/app
      # Preserve node_modules from the image
      - frontend_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8901"]
    healthcheck:
      # Disable healthcheck in dev mode for faster startup
      test: ["CMD-SHELL", "exit 0"]
      interval: 1m
      timeout: 10s
      retries: 1

volumes:
  frontend_node_modules:
    name: flights-scanner-frontend-node-modules
