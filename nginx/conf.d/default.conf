# HTTP server - serves application (use init-letsencrypt.sh to enable SSL)
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge (for SSL certificate generation)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Protected API Documentation endpoints (HTTP Basic Auth)
    # Access with username/password configured in /etc/nginx/.htpasswd
    location ~ ^/api/(docs|redoc|openapi\.json) {
        auth_basic "API Documentation";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://backend:8900;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API proxy (public endpoints)
    location /api/ {
        proxy_pass http://backend:8900/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for long-running scan operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Frontend proxy
    location / {
        proxy_pass http://frontend:8901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
