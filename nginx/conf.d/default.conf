# HTTP server - redirects to HTTPS in production
# For development/testing without SSL, this serves the application
server {
    listen 80;
    server_name _;

    # Uncomment the following lines when SSL is configured to redirect HTTP to HTTPS
    # return 301 https://$host$request_uri;

    # Comment out the location blocks below when SSL is enabled and redirect is active

    # Backend API proxy
    location /api/ {
        proxy_pass http://backend:8900/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeouts for long-running scan operations
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Frontend proxy
    location / {
        proxy_pass http://frontend:8901;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

