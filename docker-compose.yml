version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: flights-scanner-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_EXTERNAL_PORT:-8902}:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-flights_scanner}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGO_USERNAME}", "--password", "${MONGO_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flights-scanner-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8900}:8900"
    env_file:
      - .env
    environment:
      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      # Gunicorn worker settings for API performance
      # GUNICORN_WORKERS: Number of API worker processes (default: 4)
      # Increase for high-traffic scenarios, decrease for low-memory environments
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      # MAX_SCAN_WORKERS: Thread pool size for background flight scans (default: 4)
      # Controls how many scans can run concurrently without blocking the API
      MAX_SCAN_WORKERS: ${MAX_SCAN_WORKERS:-4}
      # WORKER_TIMEOUT: Worker timeout in seconds (default: 300)
      WORKER_TIMEOUT: ${WORKER_TIMEOUT:-300}
    # Optional: mount code for development (comment out for production)
    # volumes:
    #   - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flights-scanner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8901}:8901"
    env_file:
      - .env
    environment:
      # Nuxt settings
      HOST: 0.0.0.0
      PORT: 8901
      NODE_ENV: production
      # Client-side API URL (browser) - uses relative path proxied by nginx
      CLIENT_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_started  # Changed from service_healthy to service_started
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8901', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Scheduler Service - Automatically triggers scans every 8 hours
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    container_name: flights-scanner-scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_URL: http://backend:8900
      TRIP_DURATION_DAYS: 7
      SCAN_UNTIL_DAYS: 140  # Days from now
      API_KEY: ${API_KEY}
    volumes:
      - scheduler_logs:/app/logs
    depends_on:
      backend:
        condition: service_started  # Changed from service_healthy to service_started
    networks:
      - flights-scanner-network

  # Nginx Reverse Proxy
  nginx:
    profiles: ["production"]
    image: nginx:alpine
    container_name: flights-scanner-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - nginx_logs:/var/log/nginx
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_started  # Changed from service_healthy to service_started
      frontend:
        condition: service_started  # Changed from service_healthy to service_started
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot for automatic SSL certificate management
  certbot:
    profiles: ["production"]
    image: certbot/certbot
    container_name: flights-scanner-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    networks:
      - flights-scanner-network

networks:
  flights-scanner-network:
    driver: bridge
    name: flights-scanner-network

volumes:
  mongodb_data:
    name: flights-scanner-mongodb-data
  mongodb_config:
    name: flights-scanner-mongodb-config
  scheduler_logs:
    name: flights-scanner-scheduler-logs
  nginx_logs:
    name: flights-scanner-nginx-logs
