version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: flights-scanner-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_EXTERNAL_PORT:-8902}:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-flights_scanner}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flights-scanner-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8900}:8900"
    env_file:
      - .env
    environment:
      # Python settings
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    # Optional: mount code for development (comment out for production)
    # volumes:
    #   - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flights-scanner-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8901}:8901"
    env_file:
      - .env
    environment:
      # Nuxt settings
      HOST: 0.0.0.0
      PORT: 8901
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - flights-scanner-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8901', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  flights-scanner-network:
    driver: bridge
    name: flights-scanner-network

volumes:
  mongodb_data:
    name: flights-scanner-mongodb-data
  mongodb_config:
    name: flights-scanner-mongodb-config
